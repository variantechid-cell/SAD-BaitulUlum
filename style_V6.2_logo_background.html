body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  background: rgba(248, 250, 252, 0.60);
  pointer-events: none;
}

.container {
  width: min(1100px, 94%);
  margin: auto;
  padding: 20px 0 40px;
}

.header {
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, #0f766e, #0d9488);
  color: white;
  padding: 24px 22px;
  border-radius: 20px;
  margin-bottom: 18px;
  text-align: center;
  box-shadow: 0 10px 28px rgba(15, 118, 110, 0.20);
}

.header::after {
  content: "";
  position: absolute;
  width: 230px;
  height: 230px;
  right: -90px;
  top: -120px;
  border-radius: 50%;
  background: rgba(255,255,255,.10);
  pointer-events: none;
}

.header h1 {
  margin: 0 0 8px;
  font-size: clamp(20px, 4vw, 30px);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  line-height: 1.2;
  position: relative;
  z-index: 1;
}

.school-logo {
  width: 58px;
  height: 58px;
  object-fit: contain;
  flex: 0 0 58px;
  border-radius: 50%;
  background: white;
  padding: 3px;
  box-shadow: 0 3px 12px rgba(0,0,0,.18);
}

.header p {
  margin: 4px 0;
  opacity: .95;
  position: relative;
  z-index: 1;
}

.datetime {
  margin-top: 12px;
  font-size: 14px;
  position: relative;
  z-index: 1;
}

#currentTime {
  font-size: 20px;
  font-weight: 700;
  margin-top: 3px;
  letter-spacing: .5px;
}

.scanner-card,
.result,
.summary-card,
.attendance-section {
  background: rgba(255,255,255,.94);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  border: 1px solid rgba(255,255,255,.75);
}

.scanner-card {
  border-radius: 18px;
  padding: 18px;
  box-shadow: 0 8px 24px rgba(15,23,42,.08);
  margin-bottom: 18px;
}

#reader {
  width: 100%;
  max-width: 500px;
  margin: auto;
  overflow: hidden;
  border-radius: 14px;
}

#reader video {
  border-radius: 12px;
}

.status {
  text-align: center;
  padding: 12px;
  font-weight: bold;
  color: #0f766e;
}

.buttons {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 12px;
}

button {
  border: 0;
  padding: 11px 18px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
  background: #0f766e;
  color: white;
  transition: transform .15s ease, opacity .15s ease, box-shadow .15s ease;
}

button:hover {
  opacity: .92;
  transform: translateY(-1px);
  box-shadow: 0 5px 12px rgba(15,118,110,.20);
}

button:active {
  transform: translateY(0);
}

.result {
  padding: 24px;
  border-radius: 18px;
  text-align: center;
  margin-bottom: 18px;
  box-shadow: 0 8px 24px rgba(15,23,42,.07);
}

.result-icon {
  font-size: 50px;
}

.result h2 {
  margin: 10px 0;
}

.result.success {
  border: 3px solid #22c55e;
}

.result.late {
  border: 3px solid #eab308;
}

.result.already {
  border: 3px solid #f97316;
}

.result.error {
  border: 3px solid #ef4444;
}

.summary-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 18px;
}

.summary-card {
  padding: 18px;
  border-radius: 15px;
  text-align: center;
  box-shadow: 0 6px 18px rgba(15,23,42,.07);
}

.summary-number {
  font-size: 28px;
  font-weight: bold;
  margin-top: 6px;
}

.attendance-section {
  border-radius: 18px;
  padding: 18px;
  box-shadow: 0 8px 24px rgba(15,23,42,.08);
}

.attendance-header {
  display: flex;
